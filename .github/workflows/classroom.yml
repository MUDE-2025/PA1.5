name: Autograding Tests
on:
  push:
    branches:
      - assignment
      - solution
  repository_dispatch:
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }} #https://stackoverflow.com/questions/62334460/git-history-in-a-github-action
        fetch-depth: 0
    - name: Check whether merge request has been performed
      id: check-merge
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Check whether merge request has been performed
        setup-command:
        command: if git log --oneline --all | grep Merge; then echo "merge found"; else echo "No merge found"; exit 1; fi
        timeout: 10
        max-score: 10
    - name: Set Jupyter platformdirs environment variable #to remove warning DeprecationWarning: Jupyter is migrating its paths to use standard platformdirs given by the platformdirs library
      run: echo "JUPYTER_PLATFORM_DIRS=1" >> $GITHUB_ENV
    - name: Test Scipy stats
      id: test-scipy-stats
      uses: classroom-resources/autograding-python-grader@v1
      with:
        timeout: 10
        max-score: 10
        setup-command: pip install numpy scipy pandas matplotlib jupyter ipykernel
          pytest testbook
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        CHECK-MERGE_results: "${{steps.check-merge.outputs.result}}"
        TEST-SCIPY-STATS_RESULTS: "${{steps.test-scipy-stats.outputs.result}}"
      with:
        runners: check-merge, test-scipy-stats